name: v2rayN foundation build

on:
  push:
    branches: [ v2rayn-foundation ]
    paths:
      - ".gitmodules"
      - "vendor/**"
      - "integrations/**"
      - ".github/workflows/v2rayn-foundation.yml"
      - "V2RAYN_FOUNDATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2rayn-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout including upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify pinned upstream source and license
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "vendor/v2rayN/LICENSE")) { throw "The upstream GPL-3.0 license is missing." }
          $project = Get-ChildItem "vendor/v2rayN" -Recurse -File -Filter "v2rayN.csproj" | Where-Object { $_.FullName -match "[\\/]v2rayN[\\/]v2rayN[.]csproj$" } | Select-Object -First 1
          if (-not $project) { throw "The official WPF project was not checked out." }
          $env:V2RAYN_PROJECT = $project.FullName
          Write-Host "Found official project: $($project.FullName)"
          $head = git -C vendor/v2rayN rev-parse HEAD
          $expected = "2b5c7ca75b9163ec49cb4941b18388a061c3d96d"
          if ($head -ne $expected) { throw "v2rayN submodule pin mismatch: $head" }
          $hotkeysProject = Get-ChildItem "vendor/v2rayN" -Recurse -File -Filter "GlobalHotKeys.csproj" | Select-Object -First 1
          if (-not $hotkeysProject) { throw "Nested GlobalHotKeys submodule is missing." }

      - name: Apply Moghimi integration and visual patches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./integrations/patch-v2rayn.ps1

      - name: Restore official v2rayN WPF project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Get-ChildItem "vendor/v2rayN" -Recurse -File -Filter "v2rayN.csproj" | Where-Object { $_.FullName -match "[\\/]v2rayN[\\/]v2rayN[.]csproj$" } | Select-Object -First 1
          if (-not $project) { throw "Official v2rayN project path could not be resolved." }
          dotnet restore $project.FullName
          if ($LASTEXITCODE -ne 0) { throw "Restore failed." }

      - name: Publish official WPF project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Get-ChildItem "vendor/v2rayN" -Recurse -File -Filter "v2rayN.csproj" | Where-Object { $_.FullName -match "[\\/]v2rayN[\\/]v2rayN[.]csproj$" } | Select-Object -First 1
          if (-not $project) { throw "Official v2rayN project path could not be resolved." }
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }

      - name: Verify package and license
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "publish/v2rayN.exe")) { throw "Published v2rayN.exe is missing." }
          Copy-Item "vendor/v2rayN/LICENSE" "publish/COPYING-v2rayN.txt" -Force
          if (-not (Test-Path "publish/COPYING-v2rayN.txt")) { throw "GPL license was not packaged." }
          Write-Host "v2rayN foundation publish completed."