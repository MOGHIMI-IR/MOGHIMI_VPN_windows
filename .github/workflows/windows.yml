name: Windows Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download and verify official sing-box
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip"
          $expected = "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sing-box.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\sing-box.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "sing-box SHA-256 verification failed: $actual" }
          Expand-Archive "$env:RUNNER_TEMP\sing-box.zip" "$env:RUNNER_TEMP\sing-box" -Force
          $engine = Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $engine) { throw "sing-box.exe was not found in the verified archive." }
          New-Item -ItemType Directory -Force "runtime" | Out-Null
          Copy-Item $engine.FullName "runtime\sing-box.exe" -Force
          if (Test-Path "$env:RUNNER_TEMP\sing-box\LICENSE") {
            Copy-Item "$env:RUNNER_TEMP\sing-box\LICENSE" "runtime\LICENSE-sing-box.txt" -Force
          }

      - name: Download and verify official Wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $expected = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wintun.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\wintun.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Wintun SHA-256 verification failed: $actual" }
          Expand-Archive "$env:RUNNER_TEMP\wintun.zip" "$env:RUNNER_TEMP\wintun" -Force
          $dll = Get-ChildItem "$env:RUNNER_TEMP\wintun" -Recurse -Filter "wintun.dll" |
            Where-Object { $_.FullName -match "[\\/]amd64[\\/]wintun\.dll$" } |
            Select-Object -First 1
          if (-not $dll) { throw "Official AMD64 wintun.dll was not found." }
          Copy-Item $dll.FullName "runtime\wintun.dll" -Force
          $signature = Get-AuthenticodeSignature "runtime\wintun.dll"
          if ($signature.Status -ne "Valid") { throw "Wintun Authenticode signature is not valid: $($signature.Status)" }
          $license = Get-ChildItem "$env:RUNNER_TEMP\wintun" -Recurse -File |
            Where-Object { $_.Name -match "^(LICENSE|COPYING)(\.txt)?$" } |
            Select-Object -First 1
          if ($license) { Copy-Item $license.FullName "runtime\LICENSE-wintun.txt" -Force }

      - name: Restore and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          dotnet restore MoghimiVPN.sln
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed." }
          dotnet publish src/MoghimiVPN/MoghimiVPN.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -p:PublishSingleFile=false -o publish
          if ($LASTEXITCODE -ne 0) { throw "WPF app publish failed." }
          dotnet publish src/TunnelHost/MoghimiVPN.TunnelHost.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -p:PublishSingleFile=false -o publish-host
          if ($LASTEXITCODE -ne 0) { throw "Tunnel host publish failed." }
          New-Item -ItemType Directory -Force "publish" | Out-Null
          New-Item -ItemType Directory -Force "publish\tunnel-host" | Out-Null
          Copy-Item -Path "publish-host\*" -Destination "publish\tunnel-host" -Recurse -Force
          New-Item -ItemType Directory -Force "publish\runtime" | Out-Null
          Copy-Item "runtime\sing-box.exe" "publish\runtime\sing-box.exe" -Force
          Copy-Item "runtime\wintun.dll" "publish\runtime\wintun.dll" -Force
          if (Test-Path "runtime\LICENSE-sing-box.txt") { Copy-Item "runtime\LICENSE-sing-box.txt" "publish\runtime\" -Force }
          if (Test-Path "runtime\LICENSE-wintun.txt") { Copy-Item "runtime\LICENSE-wintun.txt" "publish\runtime\" -Force }
          & "runtime\sing-box.exe" version
          if ($LASTEXITCODE -ne 0) { throw "sing-box runtime smoke test failed." }
          & "runtime\sing-box.exe" check -c "tools\smoke-config.json"
          if ($LASTEXITCODE -ne 0) { throw "sing-box TUN/DNS config validation failed." }
          dotnet run --project tools/ConfigSmoke/MoghimiVPN.ConfigSmoke.csproj --configuration Release -- "runtime\sing-box.exe"
          if ($LASTEXITCODE -ne 0) { throw "A protocol configuration failed sing-box validation." }
          if (!(Test-Path "publish\MoghimiVPN.exe")) { throw "WPF application executable missing." }
          if (!(Test-Path "publish\tunnel-host\MoghimiVPN.TunnelHost.exe")) { throw "Tunnel host executable missing." }

      - name: Optional Authenticode signing
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_PASSWORD)) {
            Write-Host "No public code-signing certificate configured; keeping CI artifacts unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "moghimi-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK SignTool was not found." }
          foreach ($file in @("publish\MoghimiVPN.exe", "publish\MoghimiVPN.dll", "publish\tunnel-host\MoghimiVPN.TunnelHost.exe", "publish\tunnel-host\MoghimiVPN.TunnelHost.dll")) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file" }
          }

      - name: Launch published Windows app and helper smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = (Resolve-Path "publish\MoghimiVPN.exe").Path
          $process = Start-Process -FilePath $app -ArgumentList "--startup-smoke-test" -PassThru
          if (-not $process.WaitForExit(20000)) {
            try { $process.Kill($true) } catch {}
            $log = Join-Path $env:LOCALAPPDATA "MoghimiVPN\logs\startup.log"
            if (Test-Path $log) { Get-Content $log -Tail 100 | Write-Host }
            throw "The published WPF app did not finish its startup smoke test within 20 seconds."
          }
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "MoghimiVPN\logs\startup.log"
            if (Test-Path $log) { Get-Content $log -Tail 100 | Write-Host }
            throw "The published WPF app startup smoke test failed with exit code $($process.ExitCode)."
          }
          $helper = (Resolve-Path "publish\tunnel-host\MoghimiVPN.TunnelHost.exe").Path
          $helperProcess = Start-Process -FilePath $helper -PassThru
          if (-not $helperProcess.WaitForExit(10000)) {
            try { $helperProcess.Kill($true) } catch {}
            throw "The published tunnel host did not exit for its invalid-arguments smoke test."
          }
          if ($helperProcess.ExitCode -ne 2) {
            throw "The published tunnel host runtime failed its smoke test with exit code $($helperProcess.ExitCode)."
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "artifacts" | Out-Null
          $isccPath = $null
          $command = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($command) { $isccPath = $command.Source }

          if (-not $isccPath) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ChocolateyInstall}\lib\innosetup\tools\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }

          if (-not $isccPath) {
            choco install innosetup --yes --no-progress
            $command = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
            if ($command) { $isccPath = $command.Source }
          }

          if (-not $isccPath) {
            $searchRoots = @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "${env:ChocolateyInstall}\lib\innosetup")
            foreach ($root in $searchRoots) {
              if ($root -and (Test-Path $root) -and -not $isccPath) {
                $found = Get-ChildItem $root -Recurse -Filter "ISCC.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { $isccPath = $found.FullName }
              }
            }
          }

          if (-not $isccPath) { throw "Inno Setup compiler was not found after checking PATH and standard install folders." }
          Write-Host "Using Inno Setup compiler: $isccPath"
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          & $isccPath "/DAppVersion=$version" "installer\MoghimiVPN.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Sign installer (optional)
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_PASSWORD)) {
            Write-Host "No code-signing certificate configured; skipping installer signing."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "moghimi-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK SignTool was not found." }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "artifacts\MoghimiVPN-Setup-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }

      - name: Test installer end-to-end
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Test-AppLaunch([string]$Executable, [string]$Label) {
            if (-not (Test-Path $Executable)) { throw "$Label executable missing: $Executable" }
            $process = Start-Process -FilePath $Executable -ArgumentList "--startup-smoke-test" -PassThru
            if (-not $process.WaitForExit(25000)) {
              try { $process.Kill($true) } catch {}
              $log = Join-Path $env:LOCALAPPDATA "MoghimiVPN\logs\startup.log"
              if (Test-Path $log) { Get-Content $log -Tail 100 | Write-Host }
              throw "$Label did not finish its startup smoke test within 25 seconds."
            }
            if ($process.ExitCode -ne 0) {
              $log = Join-Path $env:LOCALAPPDATA "MoghimiVPN\logs\startup.log"
              if (Test-Path $log) { Get-Content $log -Tail 100 | Write-Host }
              throw "$Label startup smoke test failed with exit code $($process.ExitCode)."
            }
            Write-Host "$Label startup smoke test passed."
          }

          $setupExe = (Resolve-Path "artifacts\MoghimiVPN-Setup-x64.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP "MoghimiVPN-Installed-Smoke"
          $setupArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot")
          $setupProcess = Start-Process -FilePath $setupExe -ArgumentList $setupArgs -PassThru -Wait
          if ($setupProcess.ExitCode -ne 0) {
            throw "Per-user installer failed with exit code $($setupProcess.ExitCode)."
          }

          if (-not (Test-Path (Join-Path $installRoot "MoghimiVPN.exe"))) {
            throw "Installer did not place MoghimiVPN.exe in the selected installation directory."
          }
          if (-not (Test-Path (Join-Path $installRoot "tunnel-host\MoghimiVPN.TunnelHost.exe"))) {
            throw "Installed app is missing the isolated tunnel host."
          }
          if (-not (Test-Path (Join-Path $installRoot "runtime\sing-box.exe"))) {
            throw "Installed app is missing the sing-box runtime."
          }

          Test-AppLaunch (Join-Path $installRoot "MoghimiVPN.exe") "Installed app"

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Per-user uninstall entry was not created." }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru -Wait
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)."
          }
          Write-Host "Installer install, startup and uninstall smoke tests passed."

      - name: Publish Installer to Windows Supabase (optional)
        if: ${{ secrets.WINDOWS_SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: pwsh
        env:
          WINDOWS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WINDOWS_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://hxfnoaeyjnkecegpppcy.supabase.co"
          $installer = (Resolve-Path "artifacts\MoghimiVPN-Setup-x64.exe").Path
          $version = if ("$env:GITHUB_REF" -match "^refs/tags/v") { "$env:GITHUB_REF".Split("/")[-1].TrimStart("v") } else { "1.0.0" }
          $match = [regex]::Match($version, "^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)")
          if (-not $match.Success) { throw "Version '$version' is not a valid semver release." }
          $versionCode = ([int64]$match.Groups["major"].Value * 1000000) + ([int64]$match.Groups["minor"].Value * 1000) + [int64]$match.Groups["patch"].Value
          $channel = if ($version -match "(?i)(beta|alpha|rc)") { "beta" } else { "stable" }
          $fileName = "MoghimiVPN-Windows-$version-x64-Setup.exe"
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $installer).Length
          $headers = @{ apikey = $env:WINDOWS_SUPABASE_SERVICE_ROLE_KEY; Authorization = "Bearer $env:WINDOWS_SUPABASE_SERVICE_ROLE_KEY"; "x-upsert" = "true" }
          $encodedName = [uri]::EscapeDataString($fileName)
          $uploadUri = "$base/storage/v1/object/windows-releases/$encodedName"
          Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType "application/octet-stream" -InFile $installer | Out-Null
          $payload = @{
            version_name = $version
            version_code = $versionCode
            architecture = "x64"
            release_channel = $channel
            installer_url = "$base/storage/v1/object/public/windows-releases/$encodedName"
            sha256 = $sha
            file_size = $size
            release_notes = "Moghimi VPN for Windows $version"
            is_active = $true
            is_mandatory = $false
            minimum_supported_version = $null
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 8
          $dbHeaders = @{ apikey = $env:WINDOWS_SUPABASE_SERVICE_ROLE_KEY; Authorization = "Bearer $env:WINDOWS_SUPABASE_SERVICE_ROLE_KEY"; Prefer = "resolution=merge-duplicates,return=representation" }
          Invoke-RestMethod -Method Post -Uri "$base/rest/v1/windows_app_releases?on_conflict=version_code" -Headers $dbHeaders -ContentType "application/json" -Body $payload | Out-Null
          Write-Host "Windows installer uploaded and registered: $fileName (SHA256: $sha)"

      - name: Upload Windows Setup only
        uses: actions/upload-artifact@v4
        with:
          name: MoghimiVPN-Windows-Setup-x64
          path: artifacts/MoghimiVPN-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/MoghimiVPN-Setup-x64.exe
